[package]
name = "subscription"
version = "0.1.0"
description = "Non-custodial recurring USDC subscription smart contract for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "subscription"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "idl-build"] }
anchor-spl  = { version = "0.31.1", features = ["token", "associated_token", "idl-build"] }
spl-token   = { version = "4.0", features = ["no-entrypoint"] }
