name: Sync SDK to public repo

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SDK_DEPLOY_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Push sdk/ subtree to recuro-sdk
        env:
          SDK_DEPLOY_TOKEN: ${{ secrets.SDK_DEPLOY_TOKEN }}
        run: |
          git remote add public-sdk https://AlexNaskida:${SDK_DEPLOY_TOKEN}@github.com/AlexNaskida/recuro-sdk.git
          git subtree push --prefix=sdk public-sdk main