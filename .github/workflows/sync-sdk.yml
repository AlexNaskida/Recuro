name: Sync SDK to public repo

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "naskidashvili.alex@gmail.com"
          git config user.name "AlexNaskida"

      - name: Setup target repo
        run: |
          git clone https://AlexNaskida:${{ secrets.SDK_DEPLOY_TOKEN }}@github.com/AlexNaskida/recuro-sdk.git /tmp/recuro-sdk

      - name: Copy sdk contents
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            sdk/ /tmp/recuro-sdk/

      - name: Commit and push
        run: |
          cd /tmp/recuro-sdk
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "sync: update from Recuro monorepo @ ${{ github.sha }}"
          git push origin main
