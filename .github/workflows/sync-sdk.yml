name: Sync SDK to public repo

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Push sdk subtree to recuro-sdk
        run: |
          git remote remove public-sdk || true
          git remote add public-sdk https://github.com/AlexNaskida/recuro-sdk.git

          git remote set-url public-sdk https://x-access-token:${{ secrets.SDK_DEPLOY_TOKEN }}@github.com/AlexNaskida/recuro-sdk.git

          git subtree push --prefix=sdk public-sdk main
