name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"

jobs:
  anchor-build-and-test:
    name: Anchor Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana Ecosystem CLI tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify CLI install
        run: |
          rustc --version
          solana --version
          anchor --version
          node --version
          yarn --version

      - name: Generate test keypair
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Anchor build
        run: anchor build

      - name: Sync IDL to SDK
        run: cp target/idl/subscription.json sdk/src/idl.json

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-idl
          path: target/idl/subscription.json

  sdk-build:
    name: SDK Build & Type-check
    runs-on: ubuntu-latest
    needs: anchor-build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Download IDL
        uses: actions/download-artifact@v4
        with:
          name: subscription-idl
          path: sdk/src/

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Type-check SDK
        run: yarn workspace @solana-subscription/sdk type-check

      - name: Build SDK
        run: yarn workspace @solana-subscription/sdk build

      - name: Upload SDK dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  apps-build:
    name: Apps Build & Type-check
    runs-on: ubuntu-latest
    needs: sdk-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Download SDK dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

      # - name: Type-check merchant dashboard
      #   run: yarn workspace merchant-dashboard type-check

      # - name: Type-check user demo
      #   run: yarn workspace user-demo type-check

      - name: Build merchant dashboard
        run: yarn workspace merchant-dashboard build

      - name: Build user demo
        run: yarn workspace user-demo build
